name: Sync official Android releases

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run sync
      - run: npm run check
      - name: Commit changed package index
        shell: bash
        run: |
          git add -- README.md data versions
          if [ -d logs ]; then git add -- logs; fi
          if git diff --cached --quiet; then
            echo 'No official source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync new Android releases from official Weixin logs'
          git push
