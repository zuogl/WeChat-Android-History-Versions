name: 同步微信安卓版更新

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run sync
      - run: npm run check
      - name: 提交版本目录更新
        shell: bash
        run: |
          git add -- README.md data '版本'
          if [ -d '更新日志' ]; then git add -- '更新日志'; fi
          if git diff --cached --quiet; then
            echo '暂无版本更新。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '同步微信安卓版更新'
          git push
